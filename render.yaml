services:
  - type: web
    runtime: node
    name: echo-language
    buildCommand: npm ci && VITE_CUSTOM_PACKS=true npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_PACK_MODEL
        value: gpt-5.6-terra
